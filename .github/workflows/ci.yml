name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Check formatting
        working-directory: backend
        run: ruff format --check app/
      - name: Lint
        working-directory: backend
        run: ruff check app/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: backend
        run: pytest --tb=short -q --cov --cov-branch --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/exportimport/rechnung-ng:latest
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}
            BUILD_SHA=${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      # The deploy key on urserver is gated by a ForceCommand wrapper:
      # one command per ssh call, no shell (urserver: services/shared/deploy-wrapper.sh).
      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.URSERVER_DEPLOY_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo '* ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEWV/FHlapLbH+szU5sxvKObtSF6YEZphf1WjHV39ecD' > ~/.ssh/known_hosts
          r() { ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "deploy@$HOST" "$1"; }
          printf '%s' "$GITHUB_TOKEN" | r "sudo podman login ghcr.io -u exportimport --password-stdin --authfile /etc/containers/auth.json"
          r "sudo podman pull --authfile /etc/containers/auth.json ghcr.io/exportimport/rechnung-ng:latest"
          r "sudo systemctl restart rechnung-ng-backend"

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `build-${{ github.run_number }}`,
              name: `Build #${{ github.run_number }}`,
              body: `Commit: ${{ github.sha }}\nDeployed automatically after successful CI.`,
              target_commitish: '${{ github.sha }}',
            });
